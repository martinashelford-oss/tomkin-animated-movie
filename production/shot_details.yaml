    ext: A last spark fizzles in the dead lamp.
    sfx: electrical flicker, grinding gears winding down, sudden silence, wind outside
    say: []

  "014":
    who: [penny, boat]
    at: keeper_room
    time: storm_day
    cam: push-in on the crackling radio set with Penny rushing in
    base: >-
      The old radio set in the keeper's room crackles to life with a distress call; Penny rushes
