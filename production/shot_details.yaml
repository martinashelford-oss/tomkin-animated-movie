      swings his ladle and bats the yellow butter tub into the walker's exposed green reactor; a
      harmless burst of static and vapour, the walker loses power and slides down into the sea.
      Penny cheers at the doorway.
    ext: Tomkin strikes a heroic pose with his ladle raised high.
    sfx: slowed whoosh, plastic thunk, electrical burst, sliding metal, huge splash
    say: [triumphant, at the top of his voice]

  "011":
    who: [leviathan]
    at: sea
    time: storm_day
    cam: aerial descent toward the churning water where the walker sank
    base: >-
      The defeated walker sinks beneath the grey waves in a swirl of bubbles and foam; for a
      moment the water calms, then deep below, an emerald beacon begins to pulse steadily.
    ext: The pulse quickens, sending green ripples through the water.
    sfx: bubbling, sinking groan, then a low rhythmic underwater pulse
    say: []

  "012":
    who: [penny, tomkin]
    at: catwalk
