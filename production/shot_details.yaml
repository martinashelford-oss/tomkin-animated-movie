# PER-SHOT PRODUCTION DETAIL. Extends shots.json, which remains the source of truth
# for ids, order, timing, titles, actions and dialogue.
#
#   who     characters in frame (keys in continuity.yaml), for continuity text and reference images
#   at      location key        time   time-of-day/weather key
#   cam     one continuous camera move (no cuts inside a clip)
#   base    what happens in the clip's first 8 s (Veo base generation)
#   ext     how the motion continues in the extension (seconds 8–10 are kept, the rest trimmed)
#   sfx     specific sound design for this shot
#   say     optional delivery notes, one per shots.json dialogue line
#   overlay text burned in at assembly (video models cannot draw legible text)
#
# Shots 001–010 keep the plot and visual beats of the original ten clips.

shots:
  "001":
    who: [tomkin, penny]
    at: catwalk
    time: night_storm
    cam: continuous medium tracking shot moving backward along the curved catwalk ahead of the pair
    base: >-
      Tomkin marches boldly along the storm-lashed catwalk, ladle raised like a rapier, cape
      snapping in the gale, butter tub tucked under one arm; Penny follows in the wind, one hand
      on the railing, rag fluttering, rain streaming off the iron.
    ext: Tomkin points the ladle out to sea as lightning flashes behind them.
    sfx: howling gale, driving rain on iron, metallic creaks, footsteps on wet grating, thunder
    say: [grand and defiant, shouted over the wind, "dry, half-shouting over the storm"]

  "002":
    who: [tomkin, penny, drone]
    at: catwalk
    time: night_storm
    cam: whip-pan from the dark ocean to the impact point on the catwalk
    base: >-
      A gunmetal armoured drone with a crimson visor plummets out of the storm and crashes onto
      the wet iron catwalk in a shower of sparks and steam. Tomkin drops into a crouch with ladle
      and butter tub raised; Penny draws a heavy steel pipe wrench from her apron.
    ext: The drone's crimson visor flickers on and it begins to rise, steam hissing.
    sfx: screaming descent, heavy metal impact, sparks, steam hiss, rain
    say: [deadpan, eyes fixed on the drone]

  "003":
    who: [hero, drone, tomkin, penny]
    at: catwalk
    time: night_storm
    cam: low-angle tilt following the hero's swing down from the spire
    base: >-
      The masked hero swings down from the lighthouse spire on a braided orange grapple cable,
      kicks the rising drone back across the catwalk and lands in a three-point crouch, then
      looks back over a shoulder in surprise at Penny and Tomkin.
    ext: The hero straightens up, amber lenses widening, and gives a small casual wave.
    sfx: cable zip, whoosh, heavy kick impact, metal clang, landing thud, rain
    say: [casual, a little breathless, quippy]

  "004":
    who: [hero, penny, tomkin, drone]
    at: catwalk
    time: night_storm
    cam: stylised slow-motion orbit around the trio and the drone
    base: >-
      In stylised slow motion the masked hero braces against the railing and pins the drone's
      limbs with two taut orange grapple cables; Penny pries up its shoulder armour with her
      wrench; Tomkin leaps and touches an exposed blue node with his bent ladle. Raindrops hang in
      the air around blue sparks.
    ext: The drone shudders and its crimson visor dims as the slow motion eases back to real time.
    sfx: slowed-down rain, straining cables, metal prying, crackling blue sparks
    say: []

  "005":
    who: [tomkin, penny, hero, drone]
    at: catwalk
    time: night_storm
    cam: push-in from medium to close-up on the butter tub
    base: >-
      The drone's sparking core pops loose and skitters across the grating; Tomkin slams the
      yellow butter tub down over it, trapping it. The tub rattles and fizzes, then goes still.
      Penny and the hero exchange an amazed look.
    ext: Tomkin sits proudly on top of the tub, arms folded, cape fluttering.
    sfx: skittering metal, plastic thunk, muffled fizzing, rain easing
    say: [amazed and amused]

  "006":
    who: [tomkin, penny, hero]
    at: catwalk
    time: sunrise
    cam: slow crane up and around the trio to reveal the sunrise over the sea
    base: >-
      The storm parts and a brief golden dawn breaks over the ocean. Penny tightens a bolt on the
      railing with her wrench, the hero coils a grapple cable, and Tomkin polishes his ladle on his
      cape, all three bathed in warm amber light.
    ext: The three pause and gaze out at the sunrise together.
    sfx: gentle wind, distant gulls, dripping water, wrench ratchet
    say: []

  "007":
    who: [penny, tomkin, hero]
    at: sea
    time: storm_day
    cam: over-the-shoulder from the catwalk, then tilting down the cliff to the sea
    base: >-
      Clouds swallow the sun again. Penny leans over the railing and points down; far below,
      emerald light boils and churns beneath the waves at the foot of the cliff as Tomkin and the
      hero crowd in beside her.
    ext: The emerald glow pulses brighter, lighting the undersides of the waves.
    sfx: deep underwater rumble, rising wind, waves on rocks
    say: [quiet and uneasy]

  "008":
    who: [leviathan]
    at: tower_exterior
    time: storm_day
    cam: low-angle from the rocks looking up as the walker climbs
    base: >-
      An enormous barnacled mechanical crab walker heaves itself out of the surf and climbs the
      cliff toward the lighthouse, iron claws biting into the rock, green conduits glowing,
      pistons hissing, seawater cascading off its shell.
    ext: Its huge claw slams onto the base of the lighthouse wall.
    sfx: crashing surf, grinding metal, hydraulic hiss, rock cracking, deep mechanical groan
    say: []

  "009":
    who: [penny, hero, leviathan]
    at: catwalk
    time: storm_day
    cam: dynamic handheld-style move between Penny's hands and the hero's fight
    base: >-
      Penny clamps a cable to the iron railing and runs it to a lightning rod, rigging a grounding
      circuit with fast, practised hands, while the masked hero swings out on a grapple cable and
      kicks aside a giant iron claw that sweeps over the catwalk.
    ext: Penny gives a thumbs-up as the claw swings back for another strike.
    sfx: cable clamps, wrench clicks, whoosh of a giant claw, metal clang, wind
    say: []

  "010":
    who: [tomkin, hero, penny, leviathan]
    at: catwalk
    time: storm_day
    cam: slow-motion climax tracking the butter tub through the air
    base: >-
