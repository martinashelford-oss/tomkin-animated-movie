# SCORE: 12 cues covering all 90 shots. Use original or properly licensed music only (CLAUDE.md).
#
# There are two ways to supply music:
#  1. One full-length track:  python scripts/assemble.py --music assets/audio/music.mp3
#  2. Cue by cue:             assets/audio/music/M01.wav … M12.wav (any length; looped or trimmed with fades)
# Either way the music is ducked under dialogue and SFX automatically.
# `prompt` works as a brief for a composer, a library search, or an AI music
# generator whose licence covers this use.

theme: >-
  Heroic seafaring main theme in D minor rising to D major: French horns and low strings,
  snare-driven adventure rhythm, a comic bassoon/pizzicato motif for Tomkin's pomposity,
  a warm solo-violin motif for Penny, and a swooping brass motif for the masked hero.

