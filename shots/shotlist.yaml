    Wi-Fi rings from the distant lighthouse ripple over them and tiny dreamy
    nature-documentary images flicker in bubbles above their heads. One
    dolphin smiles contentedly in its sleep.
  sfx: [gentle waves, sleepy dolphin clicks, soft digital shimmer]

