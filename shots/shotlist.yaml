# TOMKIN AND THE LIGHTHOUSE LEVIATHAN — 90-SHOT LIST
#
# Running time target: 900 s (15:00). `make validate` enforces 90 shots / 900 s.
#
# Fields
#   duration    seconds used in the final cut (trimmed from the generated clip)
#               <= 8  -> one 8 s Veo generation
#               9..15 -> 8 s generation + one 7 s Veo extension (15 s generated)
#   action      what happens in the first 8 s
#   action_ext  what happens in the 7 s extension (required when duration > 8)
#   dialogue    {who, line, delivery?, ext?}  ext: true = spoken in the extension
#   sfx         sound effects Veo should generate in-clip (also used for the SFX cue sheet)
#   overlay     text burned in during assembly (AI video can't render legible text reliably)
#   props       keys from bible/characters.yaml `props`
#
# Dialogue is condensed from the source story to fit screen time (~2.5 words/s);
# every joke and beat of the story is kept, in order.

chapters:
  1: "Chapter the First · In Which We Meet Our Heroes and Immediately Question Their Life Choices"
  2: "Chapter the Second · In Which a Dog Arrives and Smells Precisely as Bad as You Would Expect"
  3: "Chapter the Third · In Which a Fairy and an Elf Materialise, and Technology Immediately Suffers"
  4: "Chapter the Fourth · In Which They Go to Space, and Duggie Is Strapped to the Roof"
  5: "Chapter the Fifth · In Which the Glitch-Bots Prove That Villainy Is Very Boring"
  6: "Chapter the Sixth · In Which Duggie Saves the Day in Extreme Slow Motion, and a Cage Becomes Pudding"
  7: "Chapter the Seventh · In Which Everyone Comes Home, and the Ice Cream Is Not Shared"

shots:

# ───────────────────────── CHAPTER 1 · MEET OUR HEROES ─────────────────────────
- id: 1
  chapter: 1
  location: lighthouse_ext
  duration: 15
  characters: []
  camera: Sweeping aerial establishing shot, low over the waves, pushing in toward the cliff
  action: >-
    Dawn over the Forgotten Sea. The camera skims the waves toward a jagged
    cliff at the edge of the world, where the copper lighthouse stands tall,
    its beam sweeping and rings of Wi-Fi light pulsing out over the water.
  action_ext: >-
    The camera rises up the copper-wrapped tower past porthole windows to the
    lamp room as the great beam swings directly across the lens in a warm flare.
  sfx: [crashing waves, gulls, sea wind, deep beacon hum, sparkling Wi-Fi shimmer]
  overlay: {text: "TOMKIN\nand the\nLIGHTHOUSE LEVIATHAN", start: 1.5, end: 9, style: title}

- id: 2
